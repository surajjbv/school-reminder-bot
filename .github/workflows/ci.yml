name: CI
on:
  push:
  pull_request:

jobs:
  test:
    # macOS: the OCR test builds ocr.swift (Vision, PDFKit) with swiftc; no signing needed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
